# ═══════════════════════════════════════════════════════════════════
#  OmNiCloud RDP Engine v4.1 — Free RDP tối ưu cho Việt Nam
#  ─────────────────────────────────────────────────────────────────
#  HƯỚNG DẪN CÀI ĐẶT NHANH (không cần tạo secret nào cả):
#    1. Tạo repository mới (hoặc fork) trên GitHub của bạn
#    2. Tạo file .github/workflows/omni_connect.yml — dán toàn bộ
#       nội dung này vào → Commit
#    3. Vào tab Actions → chọn "OmNiCloud RDP Engine" → Run workflow
#         - coreKey        : GIỮ NGUYÊN giá trị mặc định
#         - userEmail      : email ĐÃ ĐĂNG KÝ + XÁC MINH trên web
#         - osChoice       : Windows Server 2025 / 2022 / latest
#         - customUsername : tên đăng nhập RDP (mặc định: omnicloud)
#    4. Chờ ~2-4 phút — tiến độ hiện trực tiếp trên dashboard, thông
#       tin kết nối + nút tải OmNiCloud Connect tự xuất hiện khi sẵn sàng.
#
#  Web chính thức : https://omnicloud.space-z.ai
#  Core Endpoint  : https://omnicloud.space-z.ai/api/get-core
#  Đường truyền   : OmNiCloud Relay — TỰ CHẾ 100% qua domain riêng
#                   omnicloud.space-z.ai (KHÔNG dùng bore/cloudflare/
#                   pinggy hay dịch vụ tunnel có sẵn nào)
#                   + Native RDP UDP phía máy chủ (độ trễ thấp)
#  Thời gian      : ~2-4 phút — tiến độ hiện TRỰC TIẾP trên dashboard
# ═══════════════════════════════════════════════════════════════════

name: OmNiCloud RDP Engine

on:
  workflow_dispatch:
    inputs:
      coreKey:
        description: 'OMNI_CORE_KEY — giữ nguyên giá trị mặc định'
        required: true
        type: string
        default: 'omni_vn_core_2026_free_rdp'
      userEmail:
        description: 'Email đã đăng ký & xác minh trên OmNiCloud'
        required: true
        type: string
      osChoice:
        description: 'Chọn hệ điều hành Windows Server'
        required: true
        type: choice
        default: 'windows-2025'
        options:
          - windows-2025
          - windows-2022
          - windows-latest
      customUsername:
        description: 'Tên đăng nhập RDP (không bắt buộc — mặc định: omnicloud)'
        required: false
        type: string
        default: 'omnicloud'

jobs:
  omni-rdp:
    name: OmNiCloud RDP (4 vCPU / 16 GB RAM / GMT+7)
    runs-on: ${{ github.event.inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: '☁️ Kết nối OmNiCloud Core Engine'
        env:
          EMAIL:   ${{ github.event.inputs.userEmail }}
          RDPUSER: ${{ github.event.inputs.customUsername }}
          REPO:    ${{ github.repository }}
          OSTYPE:  ${{ github.event.inputs.osChoice }}
          COREKEY: ${{ github.event.inputs.coreKey }}
        shell: pwsh
        run: |
          Write-Host ''
          Write-Host '  ☁️  OMNICLOUD RDP ENGINE v4.1 — TỰ CHẾ RELAY' -ForegroundColor Cyan
          Write-Host ('  Hệ điều hành : ' + $env:OSTYPE) -ForegroundColor Cyan
          Write-Host ('  Email        : ' + $env:EMAIL) -ForegroundColor Cyan
          Write-Host '  Đang bắt tay với Core Engine...' -ForegroundColor Cyan
          Write-Host ''

          $apiUrl = 'https://omnicloud.space-z.ai/api/get-core'
          $body = @{
            action   = 'handshake'
            email    = $env:EMAIL
            username = $env:RDPUSER
            repo     = $env:REPO
            os       = $env:OSTYPE
            key      = $env:COREKEY
          } | ConvertTo-Json

          try {
            $core = Invoke-RestMethod -Uri $apiUrl -Method Post -Body $body -ContentType 'application/json' -TimeoutSec 60

            if ($core.success -eq $true) {
              Write-Host '  ✅ Core Engine đã chấp nhận!' -ForegroundColor Green
              Write-Host ('  Cấu hình: ' + $core.specs) -ForegroundColor DarkGray
              Write-Host '  Đang tải Core Script và khởi tạo máy chủ...' -ForegroundColor Green
              Write-Host ''
              Invoke-Expression $core.script
            } else {
              Write-Host ('  ⛔ TỪ CHỐI: ' + $core.message) -ForegroundColor Red
              Write-Host '  >> Email phải ĐĂNG KÝ + XÁC MINH trên web OmNiCloud trước.' -ForegroundColor Yellow
              Write-Host '  >> OMNI_CORE_KEY giữ nguyên mặc định: omni_vn_core_2026_free_rdp' -ForegroundColor Yellow
              exit 1
            }
          } catch {
            Write-Host '  ⛔ Lỗi mạng — không kết nối được về Core OmNiCloud.' -ForegroundColor Red
            Write-Host ($_.Exception.Message) -ForegroundColor DarkGray
            exit 1
          }
          
